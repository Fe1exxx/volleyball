version: '3.8'

services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: volleyball-backend
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    environment:
      DB_HOST: ${DB_HOST} 
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      PORT: ${BACKEND_PORT:-3001}
    networks:
      - app-network
    volumes:
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: volleyball-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data: