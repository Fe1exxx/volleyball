version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: volleyball-db
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: volleyball-backend
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-volleyball}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      PORT: ${BACKEND_PORT:-3001}
    depends_on:
      - db
    networks:
      - app-network
    volumes:
      # - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: volleyball-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data: